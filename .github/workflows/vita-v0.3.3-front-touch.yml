name: Build GreenVita 0.3.3 Front Touch L3/R3
on:
  push:
    branches: [vita-v0.3.3-front-l3-r3]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: green-vita-v033-front-touch
  cancel-in-progress: true
jobs:
  input-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --edition=2024 --test src/streaming/input.rs -o /tmp/green-vita-input-tests && /tmp/green-vita-input-tests
      - run: rustc --edition=2024 --test src/streaming/policy.rs -o /tmp/green-vita-policy-tests && /tmp/green-vita-policy-tests
      - run: rustc --edition=2024 --test src/streaming/hud.rs -o /tmp/green-vita-hud-tests && /tmp/green-vita-hud-tests
      - run: rustc --edition=2024 --test src/streaming/benchmark.rs -o /tmp/green-vita-benchmark-tests && /tmp/green-vita-benchmark-tests
  build:
    needs: input-policy-tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vita-rust/vitasdk-rs:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile candidate VPK
        env:
          RUSTFLAGS: "-C target-feature=-neon"
        run: cargo vita build vpk --release
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: GreenVita-0.3.3-front-touch-test
          path: target/armv7-sony-vita-newlibeabihf/release/green-vita.vpk
          if-no-files-found: error
