name: Publish GreenVita v0.3.1 Beta (PT-BR / EN)

on:
  push:
    branches: [vita-v0.3.1-xhome-fastpath]
    paths: [.github/workflows/publish-green-vita-v0.3.1.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: green-vita-v0.3.1-beta.1-publish
  cancel-in-progress: true

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bilingual release notes
        uses: actions/checkout@v4
      - name: Download VitaSDK build from verified successful CI run
        uses: actions/download-artifact@v4
        with:
          run-id: 45489319730
          github-token: ${{ github.token }}
          repository: joaopedr00000/green-vita-xconsole
          name: GreenVita-720p-XGPUConsole-Diagnostics
          path: dist
      - name: Verify compiled VPK and bilingual release notes
        run: |
          set -euo pipefail
          test -s dist/green-vita.vpk
          test -s docs/releases/v0.3.1-beta.1.md
          echo 'This VPK was built from successful VitaSDK run 45489319730.'
          echo 'Branch changes after build are limited to this release workflow.'
      - name: Publish bilingual release with VPK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.1-beta.1 >/dev/null 2>&1; then
            echo 'v0.3.1-beta.1 already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create v0.3.1-beta.1 dist/green-vita.vpk \
            --target "$GITHUB_SHA" \
            --title "GreenVita v0.3.1 Beta — Xbox Remote Play & LAN Fast Path / Uso Remoto" \
            --notes-file docs/releases/v0.3.1-beta.1.md \
            --prerelease
