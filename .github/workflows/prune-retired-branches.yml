name: Retire old test branches (one-time repository cleanup)

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'joaopedr00000/green-vita-xconsole'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only obsolete branches with verified original heads
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const obsolete = {
              "console-test": "c95403b73a37ded6a96b4e3e0d7d3066668cddea",
              "device-select": "ded72beb7242d6f66f06bfd888486a7779b10512",
              "ui-cleanup": "d23ba6e6c11baa55a8a408e991368aeabd36be17",
              "vita-stream-options": "6b0f8b1a40f6916f85109b5bb778fbb293361630",
              "xbox-dashboard": "b35a5834f89282306ec0ddda6511b8fb870c79e6",
            };
            const removeIfSafe = async (name, expected) => {
              const ref = "heads/" + name;
              let actual;
              try {
                actual = (await github.rest.git.getRef({owner, repo, ref})).data.object.sha;
              } catch (error) {
                if (error.status === 404) {
                  core.info("Already absent: " + name);
                  return;
                }
                throw error;
              }
              if (actual !== expected) {
                core.warning("Kept changed branch: " + name + " (" + actual + ")");
                return;
              }
              await github.rest.git.deleteRef({owner, repo, ref});
              core.info("Deleted obsolete branch: " + name);
            };
            for (const [name, sha] of Object.entries(obsolete)) {
              await removeIfSafe(name, sha);
            }
            // Only retire the completed release branch if its commit has
            // already been fast-forwarded to the default branch.
            const master = (await github.rest.git.getRef({
              owner, repo, ref: "heads/master"
            })).data.object.sha;
            let experiment;
            try {
              experiment = (await github.rest.git.getRef({
                owner, repo, ref: "heads/original-auto-xgpuconsole"
              })).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (experiment && master === experiment) {
              await removeIfSafe("original-auto-xgpuconsole", experiment);
            } else {
              core.warning("Kept release branch; current master does not match");
            }
